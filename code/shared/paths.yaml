# Relative paths are resolved from the project root (src).
datasets:
  source_root: data/datasets
  prepared: data/datasets/processed/ielts-v3
  hugging_face_train: data/datasets/chillies - IELTS-writing-task-2-evaluation/hugging_face_train.csv
  hugging_face_test: data/datasets/chillies - IELTS-writing-task-2-evaluation/hugging_face_test.csv
  writing9_train: data/datasets/ndtran0101 - writing9-ielts-essays/data/train.jsonl
  writing9_test: data/datasets/ndtran0101 - writing9-ielts-essays/data/test.jsonl
  transformed_hugging_face: data/datasets/chillies - IELTS-writing-task-2-evaluation/transformed_dataset.csv
  llm_train: data/datasets/train_llm.csv
  llm_test: data/datasets/test_llm.csv

external:
  aes_predictions: data/legacy/AES predictions/predictions_table.csv

resources:
  ielts_criteria: code/shared/resources/ielts_criteria.yaml

results:
  dataset_runs: results/datasets/ielts-v3
  ordinal_regression: results/ordinal_regression
  llm_training: results/llm
  llm_predictions: results/llm_predictions.json
  llm_hugging_face_responses: llm_test_results/hugging_face
  llm_openai_responses: llm_test_results/openai
  panda_insights: results/panda_insights.csv
  panda_evaluations: results/panda_evaluation_results.json
  llm_aggregated: results/llm_aggregated.csv
  llm_evaluation: data/legacy/LLM evaluation
  llm_evaluation_results: data/legacy/LLM evaluation/results
  llm_non_fine_tuned_results: data/legacy/LLM evaluation/results/non_fine_tuned
  llm_fine_tuned_results: data/legacy/LLM evaluation/results/fine_tuned
  result_plots: result_plots
  prompt_image: output/ielts_prompt.png
  aes_architecture_image: output/aes_model.webp
  non_fine_tuned_plots: result_plots/metrics/non_fine_tuned
  fine_tuned_plots: result_plots/metrics/fine_tuned

evaluation_sources:
  fine_tuned:
    Raw models: data/legacy/LLM evaluation/Fine-tuned models/Raw models
    Raw models + Rubric: data/legacy/LLM evaluation/Fine-tuned models/Raw models + Rubric
    Raw models + Rubric + PANDA: data/legacy/LLM evaluation/Fine-tuned models/Raw models + Rubric + PANDA
    Raw models + PANDA + Scores: data/legacy/LLM evaluation/Fine-tuned models/Raw models + PANDA + Scores
  non_fine_tuned:
    Raw models: data/legacy/LLM evaluation/Non Fine-tuned models/Raw models
    Raw models + Rubric: data/legacy/LLM evaluation/Non Fine-tuned models/Raw models + Rubric
    Raw models + PANDA: data/legacy/LLM evaluation/Non Fine-tuned models/Raw models + PANDA
    Raw models + PANDA + Scores: data/legacy/LLM evaluation/Non Fine-tuned models/Raw models + PANDA + Scores
    Raw models + Rubric + PANDA: data/legacy/LLM evaluation/Non Fine-tuned models/Raw models + Rubric + PANDA
    Raw models + Rubric + PANDA + Scores: data/legacy/LLM evaluation/Non Fine-tuned models/Raw models + Rubric + PANDA + Scores

files:
  llm_evaluation_truth: y_test.csv
  llm_aggregate: results.csv
  llm_response: "result_{evaluation}.json"
  llm_response_diagnostics: diagnostics
  llm_metric_output_subdirectories:
    across_runs: mean_metrics_across_runs
    calibration: calibration
  llm_metric_plot_stems:
    qwk: mean_qwk_across_runs
    mae: mean_mae_across_runs
    rmse: mean_rmse_across_runs
    adjacent_accuracy: adjacent_accuracy_across_runs
    pearson: mean_pearson_corr_across_runs
    spearman: mean_spearman_corr_across_runs
    calibration: calibration
  ordinal_model: ordinal_model.pt
  score_distribution_plot: score_distribution_grid.webp
  aes_metric_plots:
    mae: mae_per_criterion.png
    mse: mse_per_criterion.png
    qwk: qwk_per_criterion.png
    rmse: rmse.png
    adjacent_accuracy: adj_acc.png
    pearson: pearson.png
    spearman: spearman.png
    calibration: calibration_all.png
    error_histogram: "error_hist_{name}.png"
