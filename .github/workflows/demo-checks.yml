name: Demo contract checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r code/offline_research/requirements-evaluation.txt
      - run: python -m pip install datasets==4.6.1 peft==0.18.1
      - name: Offline portable contracts
        run: python -B Manage.py test --suite portable
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-checks
          path: .cache/checks/
          include-hidden-files: true
